name: Keep Bot Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping bot (wake Render free instance)
        run: |
          URL="https://ezostylia-discord-bot.onrender.com/"
          # Render free usypia usługę po 15 min; pierwsze żądanie budzi ją (do ok. 60 s)
          for i in 1 2 3 4; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 75 "$URL" || true)
            echo "Próba $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Bot is alive!"
              exit 0
            fi
            sleep 20
          done
          echo "Bot nie odpowiada po 4 próbach"
          exit 1
